name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out github actions
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on:  ubuntu-latest
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This jov is now running on a ${{ runner.os }} server hosted by github."
      - run: echo "The name of your branch is ${{ github.ref}} and repo is ${{github.repository}}"
      - name: Check out repo code
        uses: actions/checkout@v6
      - run: echo "The ${{github.repository}} repo has been cloned to the runner."
      - run: echo "The workflow is now ready to test the code"
      - name: List files in the repo
        run: |
          ls ${{github.workspace}}
      - run: echo "this jobs status is ${{ job.status }}
